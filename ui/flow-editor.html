<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flow Editor</title>
<style>
:root{
  --paper:#F7F6F2;--card:#fff;--ink:#1F1D1A;--ink2:#55514A;--ink3:#7A756C;--line:#DDD9D0;--line2:#C7C2B6;
  --accent:#9A3B1E;--accent-soft:#F3E2DA;--ok:#2C6E49;--ok-soft:#E1F0E6;--warn:#8A5A00;--warn-soft:#FBEFD5;--bad:#A12C2C;--bad-soft:#F7E0E0;
  --display:Georgia,"Times New Roman",serif;--text:"Segoe UI",system-ui,-apple-system,sans-serif;--mono:Consolas,"SF Mono",ui-monospace,monospace;
  --r-core:#9A3B1E;--r-review:#2D4B7A;--r-docs:#5B6B3A;--r-ops:#6A4C93;--r-owner:#1F1D1A;--r-custom:#7A756C;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121210;--card:#1B1B18;--ink:#ECE9E2;--ink2:#B8B3A8;--ink3:#8E897E;--line:#2C2B27;--line2:#3C3A34;--accent:#E07A52;--accent-soft:#3A2419;--ok:#6BC28E;--ok-soft:#16281D;--warn:#E8C778;--warn-soft:#2E2614;--bad:#F08A8A;--bad-soft:#341818;--r-core:#E07A52;--r-review:#8FB0E8;--r-docs:#A9BF7A;--r-ops:#B79BE0;--r-owner:#ECE9E2;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#121210;--card:#1B1B18;--ink:#ECE9E2;--ink2:#B8B3A8;--ink3:#8E897E;--line:#2C2B27;--line2:#3C3A34;--accent:#E07A52;--accent-soft:#3A2419;--ok:#6BC28E;--ok-soft:#16281D;--warn:#E8C778;--warn-soft:#2E2614;--bad:#F08A8A;--bad-soft:#341818;--r-core:#E07A52;--r-review:#8FB0E8;--r-docs:#A9BF7A;--r-ops:#B79BE0;--r-owner:#ECE9E2;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--text)}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
header h1{font:600 20px var(--display);margin:0}
header .proj{font:12px var(--mono);color:var(--ink3);overflow-wrap:anywhere}
header .sp{flex:1}
.btn{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:3px 9px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
select,input[type=text],textarea{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:6px 9px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical;font:12.5px/1.5 var(--mono)}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;border:0}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-mute{background:var(--line);color:var(--ink2)}
button.badge{cursor:pointer}
.shell{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:calc(100vh - 62px)}
nav{border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:2px;background:var(--card)}
nav button{all:unset;cursor:pointer;padding:8px 12px;border-radius:8px;display:flex;justify-content:space-between;gap:8px;color:var(--ink2)}
nav button[aria-selected=true]{background:var(--accent-soft);color:var(--ink);font-weight:600}
nav button:focus-visible,.stage:focus-visible{outline:2px solid var(--accent)}
main{padding:20px clamp(16px,3vw,32px) 60px;min-width:0}
h2{font:600 22px var(--display);margin:0 0 4px}
h3{margin:18px 0 8px;font-size:15px}
.lead{color:var(--ink2);margin:0 0 16px;max-width:78ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line2);border-radius:999px;padding:4px 12px;background:var(--card);cursor:pointer;font-size:13px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.add{border-style:dashed;color:var(--ink3)}
.lane{margin-top:14px;display:flex;overflow-x:auto;padding:4px 2px 14px;align-items:stretch}
.stage{flex:0 0 190px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;border-top:4px solid var(--rc,var(--line2));cursor:pointer;text-align:left}
.stage[aria-current=true]{box-shadow:0 0 0 2px var(--accent)}
.stage .who{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.dot{width:9px;height:9px;border-radius:50%;background:var(--rc,var(--ink3));flex:none}
.stage .t{font-weight:600}
.stage .p{font-size:12.5px;color:var(--ink2)}
.stage.gate{border:2px dashed var(--accent);background:var(--accent-soft)}
.stage.gate .who{color:var(--accent)}
.stage.word{border:2px solid var(--r-owner);background:transparent}
.arrow{flex:0 0 22px;display:flex;align-items:center;justify-content:center;color:var(--ink3)}
.addstage{flex:0 0 110px;border:1px dashed var(--line2);border-radius:12px;color:var(--ink3);cursor:pointer;background:transparent}
.tag{font-size:11.5px;border-radius:6px;padding:1px 6px;background:var(--line);color:var(--ink2)}
.tag.cond{background:var(--warn-soft);color:var(--warn)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.split{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.rolelist{display:flex;flex-direction:column;gap:2px}
.rolelist button.r{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px}
.rolelist button.r[aria-selected=true]{background:var(--accent-soft);font-weight:600}
.rolelist .cls{margin-left:auto;font:11px var(--mono);color:var(--ink3)}
.form{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px 14px;align-items:start}
.form>label{font-size:12px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;padding-top:7px}
.form .full{grid-column:1/-1}
.kits{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.kit{display:inline-flex;align-items:center;gap:4px;font:12.5px var(--mono);border:1px solid var(--line2);border-radius:6px;padding:2px 4px 2px 8px;background:var(--paper)}
.kit button{all:unset;cursor:pointer;color:var(--ink3);padding:0 4px}
.src{display:grid;gap:4px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.src:first-child{border-top:0}
.src code{font:12.5px var(--mono);overflow-wrap:anywhere}
.src .why{color:var(--ink3);font-size:12px}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink2)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:600;white-space:nowrap}
td.c,th.c{text-align:center}
tr:last-child td{border-bottom:0}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.find{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.find:first-child{border-top:0}
.find .fix{font-size:12.5px;color:var(--ink3)}
.sig{display:inline-block;width:20px;height:20px;border-radius:50%;line-height:20px;text-align:center;font-size:11px;font-weight:600}
.s-ok{background:var(--ok-soft);color:var(--ok)}.s-no{background:var(--bad-soft);color:var(--bad)}.s-na{color:var(--ink3)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.preset{border:1px solid var(--line2);border-radius:12px;padding:12px 14px;background:var(--card);cursor:pointer;text-align:left}
.preset[aria-pressed=true]{border:2px solid var(--accent);padding:11px 13px}
.preset b{display:block;margin-bottom:2px}
.preset span{color:var(--ink2);font-size:13px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;max-width:min(92vw,640px);font-size:13px;z-index:10}
.empty{color:var(--ink3);font-size:13px}
.hint{font-size:12.5px;color:var(--ink3);margin-top:3px;line-height:1.45}
.intro{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:12px 14px;margin:0 0 16px;max-width:900px}
.intro .ic{font-size:20px;line-height:1.2}
.intro p{margin:0;color:var(--ink2)}
.intro .ex{font-size:12.5px;color:var(--ink3);margin-top:4px}
.welcome{background:var(--accent-soft);border-radius:14px;padding:16px 18px;margin:0 0 18px;display:grid;gap:10px;max-width:900px}
.welcome h3{margin:0;font:600 17px var(--display)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.steps div{background:var(--card);border-radius:10px;padding:10px 12px;font-size:13px}
.steps b{display:block;margin-bottom:2px}
.term{all:unset;border-bottom:1px dotted var(--ink3);cursor:help}
.term:focus-visible{outline:2px solid var(--accent)}
.drawer{position:fixed;inset:0 0 0 auto;width:min(440px,100vw);background:var(--card);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.12);z-index:20;display:flex;flex-direction:column}
.drawer header{position:static;border:0;border-bottom:1px solid var(--line)}
.drawer .body{overflow-y:auto;padding:14px 18px 40px;display:grid;gap:14px}
.drawer dt{font-weight:600}
.drawer dd{margin:2px 0 0;color:var(--ink2);font-size:13.5px}
.drawer dl{margin:0;display:grid;gap:12px}
.drawer dt[data-hl]{background:var(--warn-soft);border-radius:6px;padding:0 4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
@media (max-width:760px){.steps{grid-template-columns:1fr}}
footer{font-size:12.5px;color:var(--ink3);margin-top:22px}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  nav button{white-space:nowrap}
  .split,.form,.grid2{grid-template-columns:1fr}
  .rolelist{flex-direction:row;overflow-x:auto}
  .rolelist button.r{white-space:nowrap}
  .form>label{padding-top:0}
}
</style>
</head>
<body>
<header>
  <div><h1 id="title">Flow editor</h1><div class="proj" id="proj">loading…</div></div>
  <div class="sp"></div>
  <span id="inherits"></span>
  <span id="checkBadge" class="badge b-mute">checking…</span>
  <button class="btn" id="helpBtn" aria-haspopup="dialog">? Help</button>
  <button class="btn" id="themeBtn" aria-label="Toggle light or dark theme">◐</button>
  <button class="btn primary" id="saveBtn" disabled>Save</button>
</header>
<div class="shell">
  <nav role="tablist" aria-label="Sections" id="nav"></nav>
  <main id="main"></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<aside id="drawer" class="drawer" role="dialog" aria-modal="false" aria-labelledby="drawerTitle" hidden>
  <header><h1 id="drawerTitle" style="font-size:18px">Help: words used here</h1><div class="sp"></div><button class="btn" id="drawerClose" aria-label="Close help">✕</button></header>
  <div class="body" id="drawerBody"></div>
</aside>
<script>
const TOKEN = '__FLOW_TOKEN__';
let S = null;                 // server state: {mode, project, company, flow, findings, presets, board}
let tab = 'flow', lane = null, stageSel = null, roleSel = 'builder', dirty = false;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const GROUP = { 'chief-of-staff': 'r-owner', librarian: 'r-docs', researcher: 'r-docs', design: 'r-docs', support: 'r-docs', builder: 'r-core', hotfix: 'r-ops', 'release-ops': 'r-ops', platform: 'r-ops', qa: 'r-review', 'tech-lead': 'r-review', security: 'r-review' };
const grp = (id) => GROUP[id] || (S.flow.roles[id] && S.flow.roles[id].class === 'lane' ? 'r-core' : 'r-custom');
const rname = (id) => (S.flow.roles[id] ? S.flow.roles[id].name : id);
const isCompany = () => S.mode === 'company';

// Plain-language glossary. Every dotted-underlined word on the page opens its entry.
const GLOSSARY = [
  ['session', 'Session', 'One AI assistant with one job, like a team member: QA tests, Design draws screens, Builder writes code. Each one has its own chat window.'],
  ['chief', 'Chief of Staff', 'The one session you talk to. It turns your requests into tasks, hands them to the right sessions, and comes back to you with questions and results.'],
  ['flow', 'Flow', 'The steps every piece of work goes through, from your request to it being live. You draw it here; the tools then make sure it is followed.'],
  ['lane', 'Lane', 'One path through the flow. Different kinds of work take different lanes: a risky change takes the HIGH lane with extra checks, an urgent fix takes the Hotfix lane.'],
  ['stage', 'Stage', 'One step in a lane, done by one session. Example: "Design draws the screen" or "QA writes the tests".'],
  ['piece', 'Piece of work', 'One task, like "add a footer to invoices". The Chief of Staff gives each piece a name (R14) and puts it on a lane.'],
  ['dev', 'Dev branch', 'The shared place where finished, checked work is collected and tested together before it goes live. Think of it as the team\'s staging area.'],
  ['live', 'Live', 'What your real users see. Nothing goes live without your word.'],
  ['gate', 'Gate', 'A checkpoint. At the dev gate, code is only accepted if the right sessions have approved it. At the live gate, it also needs your word and a release record.'],
  ['signoff', 'Sign-off', 'A session\'s written "I checked this exact version and it is OK". A session can only sign as itself, and only the tools can count sign-offs.'],
  ['word', 'Your word', 'A short message from you that moves work forward: "approve" (a design), "go" (start risky work), "release" (put work live), "apply" (put an urgent fix live).'],
  ['relay', 'Relay', 'When you say your word to the Chief of Staff instead of in the session that acts. It is passed on with your exact words and the question you answered. You can switch relays off per word.'],
  ['condition', 'Condition', 'A rule that adds a check when certain files change. Example: "if login or payment files change, Security must also approve".'],
  ['preset', 'Preset', 'A ready-made flow to start from: Full company, Small team, Solo or Custom. You can change anything afterwards.'],
  ['company', 'Company defaults', 'Rules your company sets once for all its projects. A 🔒 locked rule is a minimum: a project can add checks but never remove that one.'],
  ['source', 'Preferred source', 'A GitHub link to a plugin or skill you like for a session. It is tried first when that session\'s tools are installed. Links not from well-known publishers are safety-checked first.'],
  ['plugin', 'Plugins and skills', 'Add-ons that give a session extra abilities, like understanding your programming language or testing in a browser. Each session gets only the ones its job needs.'],
];
const term = (id, text) => `<button class="term" data-act="term" data-id="${id}">${esc(text)}</button>`;
const intro = (icon, what, example) => `<div class="intro"><span class="ic" aria-hidden="true">${icon}</span><div><p>${what}</p>${example ? `<div class="ex">${example}</div>` : ''}</div></div>`;
let welcomeHidden = false;
try { welcomeHidden = localStorage.getItem('flow-welcome-hidden') === '1'; } catch { /* storage may be blocked */ }
function openHelp(hl) {
  $('#drawerBody').innerHTML = `<p class="hint" style="margin:0">Every dotted-underlined word on the page opens its explanation here.</p><dl>${GLOSSARY.map(([id, t, d]) => `<div id="g-${id}"><dt ${id === hl ? 'data-hl' : ''}>${esc(t)}</dt><dd>${esc(d)}</dd></div>`).join('')}</dl>
    <div class="note"><b>How the rules are enforced:</b> when a session tries to send code to the ${esc('dev branch')} or live, a check on your computer counts the sign-offs and records this flow asks for. If anything is missing, the code is refused and the session is told exactly what's missing.</div>`;
  $('#drawer').hidden = false;
  const el = hl && document.getElementById(`g-${hl}`); (el || $('#drawerClose')).scrollIntoView({ block: 'center' }); $('#drawerClose').focus();
}

async function api(path, body) {
  const r = await fetch(path, { method: body ? 'POST' : 'GET', headers: { 'x-flow-token': TOKEN, 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
  if (!r.ok) throw Object.assign(new Error(j.error || `HTTP ${r.status}`), { data: j });
  return j;
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 5000); }

// The layer being edited: the project's flow.json, or company.json "defaults" in company mode.
function L() { if (!isCompany()) return S.project; S.company.defaults ||= {}; return S.company.defaults; }
function laneEdit(id) {
  const l = L(); l.lanes ||= [];
  let x = l.lanes.find((y) => y.id === id && !y.removed);
  if (!x) { x = JSON.parse(JSON.stringify(S.flow.lanes.find((y) => y.id === id))); l.lanes = l.lanes.filter((y) => y.id !== id); l.lanes.push(x); }
  return x;
}
function roleEdit(id) { const l = L(); l.roles ||= {}; return (l.roles[id] ||= {}); }

let checkTimer = null;
function changed(now = false) {
  dirty = true;
  clearTimeout(checkTimer);
  const run = async () => {
    try { const st = await api('/api/check', isCompany() ? { company: S.company } : { project: S.project }); Object.assign(S, { flow: st.flow, findings: st.findings, board: st.board }); render(); }
    catch (e) { toast(`Check failed: ${e.message}`); }
  };
  if (now) run(); else checkTimer = setTimeout(run, 250);
}

// ---------------- views ----------------
function stageCard(s, i) {
  const cur = stageSel === i ? 'true' : 'false';
  if (s.kind === 'gate') {
    const l = S.flow.lanes.find((x) => x.id === lane);
    const who = s.gate === 'dev' ? (l.live_exempt_signoffs ? 'exempt' : (l.dev_signoffs || []).map(rname).join(' · ') || 'nobody') : `record + "${l.live_word || '?'}"`;
    return `<button class="stage gate" data-act="stage" data-i="${i}" aria-current="${cur}"><div class="who">Gate · ${esc(s.gate)}</div><div class="t">${esc(s.title)}</div><div class="p">${esc(who)}</div></button>`;
  }
  if (s.kind === 'word') return `<button class="stage word" data-act="stage" data-i="${i}" aria-current="${cur}"><div class="who">Owner's word</div><div class="t">${esc(s.title)}</div><div class="p">${esc(s.produces || '')}</div></button>`;
  return `<button class="stage" style="--rc:var(--${grp(s.role)})" data-act="stage" data-i="${i}" aria-current="${cur}"><div class="who"><span class="dot"></span>${esc(rname(s.role))}</div><div class="t">${esc(s.title)}</div><div class="p">${esc(s.produces || '')}</div>${s.note ? `<div><span class="tag cond">${esc(s.note)}</span></div>` : ''}</button>`;
}
function stageEditor(l) {
  const s = l.stages[stageSel]; if (!s) return '';
  const roles = Object.values(S.flow.roles).map((r) => `<option value="${esc(r.id)}" ${r.id === s.role ? 'selected' : ''}>${esc(r.name)}</option>`).join('');
  const words = Object.keys(S.flow.words).map((w) => `<option ${w === s.word ? 'selected' : ''}>${esc(w)}</option>`).join('');
  return `<div class="panel" style="margin-top:4px"><div class="form">
    <div class="full"><b>Editing step ${stageSel + 1} of ${l.stages.length}</b></div>
    <label for="st-kind">Kind</label><div><select id="st-kind" data-act="st" data-k="kind"><option value="stage" ${s.kind === 'stage' ? 'selected' : ''}>Stage (a session's work)</option><option value="word" ${s.kind === 'word' ? 'selected' : ''}>Owner's word</option><option value="gate" ${s.kind === 'gate' ? 'selected' : ''}>Gate (push)</option></select>
      <div class="hint">${s.kind === 'gate' ? 'A checkpoint. Who must approve at the dev gate is set on the Gates &amp; words tab.' : s.kind === 'word' ? 'A point where you must answer. Drawn so every session can see where your word is needed.' : 'Work one session does, like research, design, tests or the build.'}</div></div>
    ${s.kind === 'stage' ? `<label for="st-role">Session</label><select id="st-role" data-act="st" data-k="role">${roles}</select>` : ''}
    ${s.kind === 'word' ? `<label for="st-word">Word</label><select id="st-word" data-act="st" data-k="word">${words}</select>` : ''}
    ${s.kind === 'gate' ? `<label for="st-gate">Gate</label><select id="st-gate" data-act="st" data-k="gate"><option value="dev" ${s.gate === 'dev' ? 'selected' : ''}>Push to dev</option><option value="live" ${s.gate === 'live' ? 'selected' : ''}>Push live</option></select>` : ''}
    <label for="st-title">Title</label><input type="text" id="st-title" data-act="st" data-k="title" value="${esc(s.title)}">
    <label for="st-produces">Produces</label><input type="text" id="st-produces" data-act="st" data-k="produces" value="${esc(s.produces || '')}">
    <label for="st-note">Note</label><input type="text" id="st-note" data-act="st" data-k="note" value="${esc(s.note || '')}" placeholder="e.g. skip if no screen changed">

  <h3>Approved sources per session</h3>
  <div class="tbl"><table><tr><th>Session</th><th>Repo</th><th class="c">Required</th><th></th></tr>
  ${Object.entries(C.sources).flatMap(([role, list]) => list.map((x, i) => `<tr><td>${esc(rname(role))}</td><td><code>${esc(x.repo)}</code></td><td class="c"><input type="checkbox" data-act="csrcreq" data-r="${esc(role)}" data-i="${i}" ${x.required ? 'checked' : ''} aria-label="required"></td><td><button class="btn small danger" data-act="csrcdel" data-r="${esc(role)}" data-i="${i}">Remove</button></td></tr>`)).join('') || '<tr><td colspan="4" class="empty">none</td></tr>'}</table></div>
  <div class="row" style="margin-top:8px"><select id="csrc-role">${roles.map((r) => `<option value="${esc(r.id)}">${esc(r.name)}</option>`).join('')}</select><input type="text" id="csrc-repo" placeholder="owner/repo or GitHub link"><button class="btn small" data-act="csrcadd">+ Add</button></div>
  <h3>Blocked sources</h3>
  <div class="panel kits">${C.defaults.blocked_sources.map((b) => `<span class="kit">⛔ ${esc(b)}<button data-act="blockdel" data-v="${esc(b)}" aria-label="Unblock ${esc(b)}">✕</button></span>`).join('')}<input type="text" id="block-repo" placeholder="owner/repo" style="width:160px"><button class="btn small" data-act="blockadd">+ Block</button></div>`;
}

// ---------------- render ----------------
const TABS = [['flow', 'Flow'], ['sessions', 'Sessions'], ['gates', 'Gates & words'], ['check', 'Check'], ['board', 'Board'], ['presets', 'Presets'], ['company', 'Company']];
function render() {
  const a = document.activeElement, aid = a && a.id, sel = a && 'selectionStart' in a ? [a.selectionStart, a.selectionEnd] : null;
  const errors = S.findings.filter((f) => f.level === 'error').length, warns = S.findings.filter((f) => f.level === 'warning').length;
  $('#title').textContent = isCompany() ? 'Company defaults editor' : 'Flow editor';
  $('#proj').textContent = `${String(S.root).split(/[\\/]/).filter(Boolean).pop()} · ${isCompany() ? 'company.json' : '.bootstrap/flow.json'}${dirty ? ' · unsaved changes' : ''}`;
  $('#proj').title = S.root;
  $('#inherits').innerHTML = !isCompany() && S.flow.company ? `<button class="badge b-mute" data-act="tab" data-id="company">🔒 Inherits: ${esc(S.flow.company.name)}${S.flow.company.sha ? ` @ ${esc(S.flow.company.sha)}` : ''}</button>` : '';
  const b = $('#checkBadge');
  b.className = `badge ${errors ? 'b-bad' : warns ? 'b-warn' : 'b-ok'}`;
  b.textContent = errors ? `${errors} error${errors > 1 ? 's' : ''}${warns ? ` · ${warns} warning${warns > 1 ? 's' : ''}` : ''}` : warns ? `${warns} warning${warns > 1 ? 's' : ''}` : 'Flow OK';
  $('#saveBtn').disabled = !!errors || !dirty;
  $('#saveBtn').title = errors ? 'Fix the errors on the Check tab first' : dirty ? '' : 'No changes';
  $('#nav').innerHTML = TABS.map(([k, n]) => `<button role="tab" data-act="tab" data-id="${k}" aria-selected="${k === tab}">${n}${k === 'check' && (errors + warns) ? ` <span>${errors + warns}</span>` : ''}${k === 'flow' ? ` <span>${S.flow.lanes.length}</span>` : ''}${k === 'sessions' ? ` <span>${Object.keys(S.flow.roles).length}</span>` : ''}</button>`).join('');
  $('#main').innerHTML = VIEWS[tab]() + `<footer>${isCompany() ? 'Saving writes company.json in the company folder. Commit and push it; projects take it with "Check for updates".' : 'Saving writes <code>.bootstrap/flow.json</code> (enforced by the guard and the pre-push hook once committed) and <code>docs/flow.md</code> (a readable copy with diagrams).'}</footer>`;
  if (aid) { const el = document.getElementById(aid); if (el) { el.focus(); if (sel && 'setSelectionRange' in el) try { el.setSelectionRange(sel[0], sel[1]); } catch {} } }
}

// ---------------- events ----------------
document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, l = lane && S.flow.lanes.find((x) => x.id === lane);
  if (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA') { if (t.type !== 'checkbox') return; }
  if (act === 'term') { return openHelp(t.dataset.id); }
  if (act === 'help') { return openHelp(); }
  if (act === 'hidewelcome') { welcomeHidden = true; try { localStorage.setItem('flow-welcome-hidden', '1'); } catch { /* fine */ } return render(); }
  if (act === 'condword') { const c = S.flow.conditions[+t.dataset.i], lay = L(); lay.conditions ||= []; let x = lay.conditions.find((y) => y.id === c.id); if (!x) { x = JSON.parse(JSON.stringify(c)); lay.conditions.push(x); } if (t.checked) x.require_word = 'approve'; else x.require_word = ''; return changed(true); }
  if (act === 'tab') { tab = t.dataset.id; stageSel = null; return render(); }
  if (act === 'lane') { lane = t.dataset.id; stageSel = null; return render(); }
  if (act === 'stage') { stageSel = stageSel === +t.dataset.i ? null : +t.dataset.i; return render(); }
  if (act === 'role') { roleSel = t.dataset.id; return render(); }
  if (act === 'goto') { const [tb, id] = t.dataset.where.split(':'); tab = tb; if (tb === 'flow' && id) lane = id; if (tb === 'sessions' && id) roleSel = id; return render(); }
  if (act === 'mv') { const x = laneEdit(lane), i = stageSel, j = i + +t.dataset.d; if (j >= 0 && j < x.stages.length) { [x.stages[i], x.stages[j]] = [x.stages[j], x.stages[i]]; stageSel = j; changed(true); } return; }
  if (act === 'delstage') { laneEdit(lane).stages.splice(stageSel, 1); stageSel = null; return changed(true); }
  if (act === 'addstage') { const x = laneEdit(lane); x.stages.push({ kind: 'stage', role: 'builder', title: 'New stage', produces: '' }); stageSel = x.stages.length - 1; return changed(true); }
  if (act === 'addlane') {
    let n = 1; while (S.flow.lanes.some((x) => x.id === `lane-${n}`)) n++;
    const lay = L(); lay.lanes ||= [];
    lay.lanes.push({ id: `lane-${n}`, name: `New lane ${n}`, when: '', stages: [{ kind: 'stage', role: 'builder', title: 'Build', produces: 'Own branch' }, { kind: 'gate', gate: 'dev', title: 'Push to dev' }, { kind: 'word', word: 'release', title: '"release <scope>"' }, { kind: 'gate', gate: 'live', title: 'Push live' }], dev_signoffs: ['tech-lead', 'chief-of-staff'], live_word: 'release', live_exempt_signoffs: false });
    lane = `lane-${n}`; stageSel = null; return changed(true);
  }
  if (act === 'dellane') { if (!confirm(`Remove the lane "${l.name}"? Pieces that name it fall back to Normal.`)) return; const lay = L(); lay.lanes = (lay.lanes || []).filter((x) => x.id !== lane); lay.lanes.push({ id: lane, removed: true }); lane = null; return changed(true); }
  if (act === 'gate') { const x = laneEdit(t.dataset.l), r = t.dataset.r; x.dev_signoffs ||= []; x.dev_signoffs = x.dev_signoffs.includes(r) && t.type === 'checkbox' && !t.checked ? x.dev_signoffs.filter((y) => y !== r) : [...new Set([...x.dev_signoffs, r])]; return changed(true); }
  if (act === 'relay') { const lay = L(); lay.words ||= {}; lay.words[t.dataset.w] = { ...(lay.words[t.dataset.w] || {}), relay: t.checked }; return changed(true); }
  if (act === 'addcond') { const lay = L(); lay.conditions ||= []; let n = 1; while (S.flow.conditions.some((c) => c.id === `cond-${n}`)) n++; lay.conditions.push({ id: `cond-${n}`, label: 'New condition', globs: ['path/**'], require: ['tech-lead'] }); return changed(true); }
  if (act === 'delcond') { const c = S.flow.conditions[+t.dataset.i]; const lay = L(); lay.conditions = (lay.conditions || []).filter((x) => x.id !== c.id); lay.conditions.push({ id: c.id, removed: true }); return changed(true); }
  if (act === 'kitadd') { const k = t.dataset.k, v = $(`#add-${k}`).value.trim(); if (!v) return; const r = roleEdit(roleSel); r[k] = [...new Set([...(r[k] || S.flow.roles[roleSel][k] || []), v])]; return changed(true); }
  if (act === 'kitdel') { const k = t.dataset.k, r = roleEdit(roleSel); r[k] = (r[k] || S.flow.roles[roleSel][k] || []).filter((x) => x !== t.dataset.v); return changed(true); }
  if (act === 'addrole') { const id = $('#newRole').value.trim().toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-|-$/g, ''); if (!id || S.flow.roles[id]) return toast(id ? `"${id}" already exists` : 'Type an id like data-engineer'); Object.assign(roleEdit(id), { name: id.replace(/-/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase()), class: 'custom', job: '', never: '', model: 'mid' }); roleSel = id; return changed(true); }
  if (act === 'delrole') { if (!confirm(`Remove the session "${rname(roleSel)}"?`)) return; delete (L().roles || {})[roleSel]; roleSel = 'builder'; return changed(true); }
  if (act === 'preset') { if ((L().lanes || []).length && !confirm('Switching preset replaces your lane edits. Continue?')) return; const lay = L(); lay.preset = t.dataset.id; delete lay.lanes; return changed(true); }
  if (act === 'updates') {
    try { const u = await api('/api/company/updates', { project: S.project }); $('#upd').innerHTML = u.upToDate ? '<span class="badge b-ok">up to date</span>' : `<span class="badge b-warn">newer: ${esc(u.latest.slice(0, 12))}</span> <button class="btn small" data-act="apply" data-sha="${esc(u.latest)}">Use it</button>`; }
    catch (err) { $('#upd').innerHTML = `<span class="badge b-bad">${esc(err.message)}</span>`; }
    return;
  }
  if (act === 'apply') { try { const st = await api('/api/company/apply', { project: S.project, sha: t.dataset.sha }); S = { ...S, ...st }; dirty = true; render(); toast(st.note); } catch (err) { toast(err.message); } return; }
  if (act === 'floor') { const C = S.company, a = C.floor.signoffs['*'] || []; C.floor.signoffs['*'] = t.checked ? [...new Set([...a, t.dataset.r])] : a.filter((x) => x !== t.dataset.r); return changed(true); }
  if (act === 'norelay') { const f = S.company.floor; f.no_relay = t.checked ? [...new Set([...f.no_relay, t.dataset.w])] : f.no_relay.filter((x) => x !== t.dataset.w); return changed(true); }
  if (act === 'csrcadd') { const role = $('#csrc-role').value, repo = $('#csrc-repo').value.trim(); if (!repo) return; (S.company.sources[role] ||= []).push({ repo, required: false }); return changed(true); }
  if (act === 'csrcreq') { S.company.sources[t.dataset.r][+t.dataset.i].required = t.checked; return changed(true); }
  if (act === 'csrcdel') { S.company.sources[t.dataset.r].splice(+t.dataset.i, 1); if (!S.company.sources[t.dataset.r].length) delete S.company.sources[t.dataset.r]; return changed(true); }
  if (act === 'blockadd') { const v = $('#block-repo').value.trim().replace(/^https?:\/\/github\.com\//, ''); if (!v) return; S.company.defaults.blocked_sources = [...new Set([...S.company.defaults.blocked_sources, v])]; return changed(true); }
  if (act === 'blockdel') { S.company.defaults.blocked_sources = S.company.defaults.blocked_sources.filter((x) => x !== t.dataset.v); return changed(true); }
});
document.addEventListener('change', (e) => {
  const t = e.target, act = t.dataset && t.dataset.act; if (!act) return;
  if (act === 'st') { const s = laneEdit(lane).stages[stageSel]; s[t.dataset.k] = t.value; if (t.dataset.k === 'kind') { if (t.value === 'stage') s.role ||= 'builder'; if (t.value === 'word') s.word ||= 'release'; if (t.value === 'gate') s.gate ||= 'dev'; } return changed(true); }
  if (act === 'ln') { laneEdit(lane)[t.dataset.k] = t.value; return changed(true); }
  if (act === 'rf') { roleEdit(roleSel)[t.dataset.k] = t.value; return changed(true); }
  if (act === 'cond') { const c = S.flow.conditions[+t.dataset.i], lay = L(); lay.conditions ||= []; let x = lay.conditions.find((y) => y.id === c.id); if (!x) { x = JSON.parse(JSON.stringify(c)); lay.conditions.push(x); } x[t.dataset.k] = t.dataset.k === 'globs' ? t.value.split(',').map((s) => s.trim()).filter(Boolean) : t.dataset.k === 'require' ? [t.value] : t.value; return changed(true); }
  if (act === 'ext') { if (t.value.trim()) S.project.extends = t.value.trim(); else delete S.project.extends; return changed(true); }
  if (act === 'cname') { S.company.name = t.value; return changed(true); }
  if (act === 'cpreset') { S.company.defaults.preset = t.value; return changed(true); }
});
document.addEventListener('input', (e) => {
  if (e.target.dataset && e.target.dataset.act === 'src') { roleEdit(roleSel).sources = e.target.value.split(/\r?\n/).map((s) => s.trim()).filter(Boolean); changed(); }
});
$('#saveBtn').addEventListener('click', async () => {
  try { const r = await api('/api/save', isCompany() ? { company: S.company } : { project: S.project }); dirty = false; render(); toast(isCompany() ? `Saved. ${r.note}` : 'Saved. Next step: commit .bootstrap/flow.json and docs/flow.md (ask the Chief of Staff, or use git). The new rules apply once that commit is pushed.'); }
  catch (e) { toast(`Not saved: ${e.message}`); if (e.data && e.data.findings) { S.findings = e.data.findings; tab = 'check'; render(); } }
});
$('#helpBtn').addEventListener('click', () => openHelp());
$('#drawerClose').addEventListener('click', () => { $('#drawer').hidden = true; $('#helpBtn').focus(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#drawer').hidden) { $('#drawer').hidden = true; $('#helpBtn').focus(); } });
$('#themeBtn').addEventListener('click', () => { const r = document.documentElement; r.dataset.theme = (r.dataset.theme === 'dark' || (!r.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches)) ? 'light' : 'dark'; });
window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
// Deep links: #gates, #sessions/builder, #flow/high, #help (shareable, and used for the README screenshots).
function fromHash() {
  const [t, id] = decodeURIComponent(location.hash.slice(1)).split('/');
  if (t === 'help') return openHelp(id);
  if (TABS.some(([k]) => k === t)) { tab = t; if (t === 'sessions' && id) roleSel = id; if (t === 'flow' && id) lane = id; }
}
window.addEventListener('hashchange', () => { fromHash(); if (S) render(); });
api('/api/state').then((st) => { S = st; if (S.mode === 'company') { S.company ||= { version: 1, name: 'Company' }; } fromHash(); render(); }).catch((e) => { $('#main').innerHTML = `<div class="panel"><b>Could not load:</b> ${esc(e.message)}. Open the exact link printed by <code>bootstrap flow</code>.</div>`; });
</script>
</body>
</html>
